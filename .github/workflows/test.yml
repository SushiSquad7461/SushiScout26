name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3.11 -m venv venv
      - run: venv/bin/pip install -r requirements.txt pytest
      - run: venv/bin/python -m pytest tests/

  firestore-rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The Firestore emulator is a Java process, and firebase-tools requires
      # JDK 21+. The runner's default JDK is older, so without this the job
      # dies before a single rule is evaluated.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools
      - run: npm ci
        working-directory: test/firestore-rules
      - run: firebase emulators:exec --only firestore "cd test/firestore-rules && ./node_modules/.bin/jest --runInBand"
